# pyproject.toml — FTreeKG package configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Extras are user-facing features; dev tooling is a Poetry group, so it never
# ships in the wheel and cannot be pip-installed. See FLEET_STANDARDS.md.
#
# Quick install (pip)
# -------------------
#   pip install -e "."                  core runtime only
#   pip install -e ".[adapter]"         + kg-rag (for ftree_kg.adapter)
#
# Quick install (poetry)
# ----------------------
#   poetry install                      core runtime only
#   poetry install --with dev           + pytest, ruff, ty, pre-commit
#   poetry install --with kg            + the dockg/pycodekg CLIs (maintainer tooling)
#   poetry install --all-extras --with dev,kg   full maintainer environment
#
# First-time setup
# ----------------
#   poetry install --with dev
#
# Run tests
# ---------
#   pytest                          uses pytest.ini (testpaths = tests/)
#   pytest -m "not slow"            skip slow tests
#   pytest --cov=ftree_kg           with coverage
#
# Build KG indices (after code changes)
# --------------------------------------
#   ftreekg build --repo .

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "ftree_kg", from = "src" }]
# KG sister packages not yet on PyPI — install manually:
#   pip install git+https://github.com/Flux-Frontiers/agent_kg.git

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "ftree-kg"
version = "0.13.2"
description = "KGModule for file tree knowledge graphs"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "filesystem", "sqlite-vec", "sqlite", "semantic-search", "kgmodule"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    # 0.18.0: metadata.temporal_keys() derives the shared kg_utils.temporal
    # contract from EXIF capture time and filesystem mtime, so a federated
    # query can scope a tree by time.
    "kgmodule-utils[semantic,sqlite-vec]>=0.18.0",
    # Capped: mcp 2.0 split FastMCP into its own package, and mcp_server.py
    # imports it from `mcp` at module scope. Lift only alongside that port.
    "mcp>=1.0.0,<2",
    "pillow>=10.0.0",
    "rich>=13.0.0,<15.0.0",
]

[project.optional-dependencies]
# src/ftree_kg/adapter.py imports kg_rag at module scope. It is not exported
# from __init__.py and nothing in the fleet imports it (kg-rag ships its own
# kg_rag/adapters/ftree_adapter.py, which lazily imports ftree_kg instead), so
# the dependency is optional rather than core -- declaring it core would create
# a genuine cycle, since kg-rag already depends on ftree-kg.
adapter = [
    "kg-rag>=0.12.0",
]

# An `all` aggregate extra used to sit here, and it listed nothing *but* dev
# tools — so the wheel advertised them as installable no matter where the dev
# dependencies themselves lived, which is the defect that survived doc_kg's and
# Metabo_kg's group migrations. Retired: `adapter` is the only feature extra.

# ---------------------------------------------------------------------------
# Dev tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# `optional = true` keeps it out of a bare `poetry install`.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
ty = ">=0.0.44"
pre-commit = ">=4.5.1"
# >=9.0.3 is a security floor, not a preference: GHSA-6w46-j5rx-g56g.
pytest = ">=9.0.3"
pytest-cov = ">=5.0.0"
# Capped below 0.16 to match the rest of the fleet. The `*.md` exclusion under
# [tool.ruff] already blunts 0.16's Markdown reformatting, but the cap is what
# keeps the resolved ruff pinned to what .pre-commit-config.yaml declares.
ruff = ">=0.4.0,<0.16"

# ---------------------------------------------------------------------------
# Maintainer tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# doc-kg and pycode-kg are tools this repo *runs*, not libraries it imports.
# Nothing under src/ imports either one. They are here because the local
# .git/hooks/pre-commit rebuilds both indices before committing, .mcp.json
# serves `dockg` and `pycodekg` MCP servers, and .claude/CLAUDE.md documents
# `pycodekg build` / `dockg build` as the dev workflow.
#
# They used to live in the `kgdeps` and `all` extras. Extras are *published*
# metadata, so `pip install ftree-kg[all]` pulled two sibling KG packages into a
# consumer's environment for tooling they will never run. A Poetry group is
# maintainer-facing: locked and installable, but never written into the wheel.
#
#   poetry install --with kg      # get the dockg / pycodekg CLIs into .venv/bin
#   poetry install                # default: group is optional, skipped
[tool.poetry.group.kg]
optional = true

[tool.poetry.group.kg.dependencies]
doc-kg = ">=0.21.2"
pycode-kg = ">=0.23.1"

[project.urls]
Homepage   = "https://github.com/Flux-Frontiers/ftree_kg"
Repository = "https://github.com/Flux-Frontiers/ftree_kg"

[project.scripts]
ftreekg          = "ftree_kg.cli:cli"
ftreekg-build    = "ftree_kg.cli.cmd_build:build"
ftreekg-mcp      = "ftree_kg.mcp_server:main"
ftreekg-query    = "ftree_kg.cli.cmd_query:query"
ftreekg-pack     = "ftree_kg.cli.cmd_query:pack"
ftreekg-analyze  = "ftree_kg.cli.cmd_analyze:analyze"
ftreekg-snapshot = "ftree_kg.cli.cmd_snapshot:snapshot"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
# ruff 0.16 formats Python code blocks embedded in Markdown as stable behaviour
# (0.15 gated it behind preview), so `ruff format --check .` started rewriting
# prose docs. The snippets in docs/ are illustrative and deliberately aligned —
# e.g. `pack   = kg.pack(...)` lined up with its neighbours — which the
# formatter collapses. Keep docs out of its reach; doc_kg carries the same
# exclusion for the same reason.
exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
# Be lenient about third-party stubs (mirrors mypy's ignore_missing_imports).
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v --tb=short"
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests that exercise real external dependencies (model, sqlite-vec)",
]

[tool.filetreekg]
# Directories to include in indexing (empty = include all)
#include = ["src", "docs"]
exclude = ["archives", "backups"]  # additional dirs beyond DEFAULT_SKIP_DIRS

[tool.pycodekg]
# Exclude test directories from the knowledge graph.
# Tests skew architectural metrics (fan-in, public API surface, docstring coverage)
exclude = ["tests"]
include = ["src"]

[tool.dockg]
exclude = [
    "__pycache__", "bundles", "dist", "src", "tests",
]
